[package]
license.workspace = true
name = "html-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "html"

[features]
profiling = ["html-layout/profiling", "html-pipeline/profiling"]
testing = ["dep:html-wpt-test-support"]
math-export = ["dep:mathema", "dep:roxmltree"]

[dependencies]
mathema = { git = "https://github.com/DevExzh/mathema", rev = "d9cce9ffeb7346181d4c3201dc0a13727269863b", default-features = false, optional = true }
roxmltree = { version = "0.21", optional = true }
html-dom = { path = "../html-dom" }
html-layout = { path = "../04-html-layout" }
html-parse = { path = "../02-html-parse" }
html-pipeline = { path = "../html-pipeline" }
html-render-core = { path = "../05-html-render-core" }
html-resources = { path = "../html-resources" }
html-source = { path = "../01-html-source" }
html-style = { path = "../03-html-style" }
html-style-model = { path = "../html-style-model" }
html-wpt-test-support = { path = "../../test-support/html-wpt", optional = true }
