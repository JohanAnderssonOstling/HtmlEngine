[package]
autotests = false
license = "GPL-3.0-or-later"
name = "skrift"
version.workspace = true
edition.workspace = true
publish = ["crates-io"]
description = "Renders HTML and CSS in native applications."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
include.workspace = true
documentation = "https://docs.rs/skrift"

[lib]
name = "html"

[features]
profiling = ["html-pipeline/profiling"]
math-export = ["dep:mathema", "dep:roxmltree"]

[dependencies]
html-engine-model = { package = "skrift-engine-model", path = "../html-engine-model" }
web-time = "1"
kurbo.workspace = true
peniko.workspace = true
roxmltree = { version = "0.21", optional = true }
mathema = { version = "0.1.0", package = "skrift-mathema", path = "../mathema", optional = true }
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../html-dom" }
html-parse = { version = "0.1.0", package = "skrift-parse", path = "../02-html-parse" }
html-pipeline = { version = "0.1.0", package = "skrift-pipeline", path = "../html-pipeline" }
html-render-core = { version = "0.1.0", package = "skrift-render-core", path = "../05-html-render-core" }
html-resources = { version = "0.1.0", package = "skrift-resources", path = "../html-resources" }
html-style = { version = "0.1.0", package = "skrift-style", path = "../03-html-style" }
html-style-model = { version = "0.1.0", package = "skrift-style-model", path = "../html-style-model" }

[package.metadata.docs.rs]
features = ["math-export"]
