[package]
name = "skrift-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Prepares text for shaping and layout."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
include.workspace = true
documentation = "https://docs.rs/skrift-text"

[lib]
name = "html_text"

[features]
# Exposes existing normalization fixtures to downstream stage tests.
testing = []

[dependencies]
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../html-dom" }
html-style-model = { version = "0.1.0", package = "skrift-style-model", path = "../html-style-model" }
rustc_data_structures = "0.1.2"
unicode_categories = "0.1"
unicode-segmentation = "1.13"
unicode-linebreak = "0.1.5"
unicode-width = "0.2.2"
