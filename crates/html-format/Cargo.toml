[package]
name = "skrift-format"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later AND OFL-1.1"
publish = ["crates-io"]
description = "Builds formatting boxes from styled documents."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
include.workspace = true
documentation = "https://docs.rs/skrift-format"

[lib]
name = "html_format"

[features]
profiling = ["html-engine-model/profiling"]

[dependencies]
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../html-dom" }
html-style-model = { version = "0.1.0", package = "skrift-style-model", path = "../html-style-model" }
html-text = { version = "0.1.0", package = "skrift-text", path = "../html-text" }
rustc_data_structures = "0.1.2"
html-engine-model = { version = "0.1.0", package = "skrift-engine-model", path = "../html-engine-model" }
formulary = { version = "=0.3.0", default-features = false, features = ["shaping", "svg"] }
quick-xml.workspace = true
unicode_categories = "0.1"


[dev-dependencies]
html-pipeline = { package = "skrift-pipeline", path = "../html-pipeline", features = ["testing"] }
html-parse = { package = "skrift-parse", path = "../02-html-parse" }
html-style = { package = "skrift-style", path = "../03-html-style" }
lightningcss.workspace = true
