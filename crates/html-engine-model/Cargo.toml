[package]
name = "skrift-engine-model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Defines shared formatting, glyph, and geometry data."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
include.workspace = true
documentation = "https://docs.rs/skrift-engine-model"

[lib]
name = "html_engine_model"

[features]
profiling = []
testing = ["html-text/testing"]

[dependencies]
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../html-dom" }
html-style-model = { version = "0.1.0", package = "skrift-style-model", path = "../html-style-model" }
html-text = { version = "0.1.0", package = "skrift-text", path = "../html-text" }
rustc_data_structures = "0.1.2"
kurbo.workspace = true
unicode-bidi.workspace = true
unicode-segmentation = "1.13"

