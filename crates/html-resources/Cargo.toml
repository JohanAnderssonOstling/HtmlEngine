[package]
license.workspace = true
name = "skrift-resources"
version.workspace = true
edition.workspace = true
publish = ["crates-io"]
description = "Loads images and other document resources."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
include.workspace = true
documentation = "https://docs.rs/skrift-resources"

[lib]
name = "html_resources"

[features]
font-data = ["dep:ttf-parser", "dep:wuff"]

[dependencies]
base64 = "0.22"
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../html-dom" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
peniko.workspace = true
quick-xml.workspace = true
sha2 = "0.10"
ttf-parser = { version = "0.25", optional = true }
wuff = { version = "0.2.9", optional = true }
