[package]
license.workspace = true
name = "skrift-pipeline"
version.workspace = true
edition.workspace = true
publish = ["crates-io"]
description = "Coordinates incremental parsing, styling, shaping, and layout."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
include.workspace = true
documentation = "https://docs.rs/skrift-pipeline"

[lib]
name = "html_pipeline"

[features]
profiling = ["html-layout/profiling", "html-format/profiling", "html-shape/profiling"]
testing = ["html-layout/testing", "html-engine-model/testing", "html-text/testing"]

[dependencies]
html-engine-model = { version = "0.1.0", package = "skrift-engine-model", path = "../html-engine-model" }
html-format = { version = "0.1.0", package = "skrift-format", path = "../html-format" }
html-shape = { version = "0.1.0", package = "skrift-shape", path = "../html-shape" }
html-text = { version = "0.1.0", package = "skrift-text", path = "../html-text" }
rustc_data_structures = "0.1.2"
kurbo.workspace = true
web-time = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../html-dom" }
html-style-model = { version = "0.1.0", package = "skrift-style-model", path = "../html-style-model" }
html-style = { version = "0.1.0", package = "skrift-style", path = "../03-html-style" }
html-parse = { version = "0.1.0", package = "skrift-parse", path = "../02-html-parse" }
html-layout = { version = "0.1.0", package = "skrift-layout", path = "../04-html-layout" }
html-resources = { version = "0.1.0", package = "skrift-resources", path = "../html-resources" }
encoding_rs.workspace = true

[dev-dependencies]
html-layout = { package = "skrift-layout", path = "../04-html-layout", features = ["testing"] }
html-engine-model = { package = "skrift-engine-model", path = "../html-engine-model", features = ["testing"] }
html-text = { package = "skrift-text", path = "../html-text", features = ["testing"] }
html-wpt-test-support = { path = "../../test-support/html-wpt" }
