[package]
license.workspace = true
name = "skrift-layout"
version.workspace = true
edition.workspace = true
publish = ["crates-io"]
description = "Computes block, inline, table, flexbox, and grid layouts."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
include.workspace = true
documentation = "https://docs.rs/skrift-layout"

[lib]
name = "html_layout"

[features]
# Explicit diagnostic builds only; ordinary builds contain no scope hooks.
profiling = ["html-engine-model/profiling"]
testing = ["html-engine-model/testing"]

[dependencies]
unicode-bidi-mirroring = "0.4"
html-engine-model = { version = "0.1.0", package = "skrift-engine-model", path = "../html-engine-model" }
html-text = { version = "0.1.0", package = "skrift-text", path = "../html-text" }
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../html-dom" }
html-style-model = { version = "0.1.0", package = "skrift-style-model", path = "../html-style-model" }
hypher = "0.1"
kurbo.workspace = true
rustc_data_structures = "0.1.2"
rayon = "1.12"
taffy.workspace = true
unicode_categories = "0.1"
unicode-segmentation = "1.13"
unicode-normalization = "0.1"
unicode-bidi.workspace = true
web-time = "1"

[dev-dependencies]
html-pipeline = { package = "skrift-pipeline", path = "../html-pipeline", features = ["testing"] }
html-parse = { package = "skrift-parse", path = "../02-html-parse" }
html-style = { package = "skrift-style", path = "../03-html-style" }
lightningcss.workspace = true
html-text = { package = "skrift-text", path = "../html-text", features = ["testing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
