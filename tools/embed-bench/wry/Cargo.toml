[package]
name = "embed-bench-wry"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
anyhow = "1"
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
percent-encoding = "2"
serde_json = "1"
tao = "0.34"
url = "2"
webkit2gtk = { version = "2.0.1", features = ["v2_34"] }
wry = { package = "lb-wry", version = "=0.53.3" }

[profile.release]
debug = 1
