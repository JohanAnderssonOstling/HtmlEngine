[package]
name = "embed-bench-gpui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[features]
memory-profile = []

[[bin]]
name = "embed-bench-layout"
path = "../layout/main.rs"

[[bin]]
name = "embed-bench-layout-inspect"
path = "../layout/inspect.rs"

[[bin]]
name = "embed-bench-gpui-fixed"
path = "src/fixed.rs"

[[bin]]
name = "embed-bench-gpui-memory"
path = "src/memory.rs"
required-features = ["memory-profile"]

[dependencies]
anyhow = "1"
async-channel = "2"
data-url = "0.3"
gpui = { path = "../../../../GPUI-Fork/crates/gpui", default-features = false, features = ["font-kit", "wayland", "x11", "snapshot"] }
gpui_platform = { path = "../../../../GPUI-Fork/crates/gpui_platform", features = ["wayland", "x11"] }
gpui_linux = { path = "../../../../GPUI-Fork/crates/gpui_linux", features = ["snapshot"] }
gpui_wgpu = { path = "../../../../GPUI-Fork/crates/gpui_wgpu", features = ["font-kit"] }
html = { package = "html-engine", path = "../../../crates/html" }
html-gpui = { path = "../../../../Html-Prototype/shared/html-gpui" }
html-view-core = { path = "../../../../HtmlViewCore/crates/html-view-core" }
kurbo = "0.11"
pollster = "0.4"
libc = "0.2"
serde_json = "1"

[patch."https://github.com/JohanAnderssonOstling/HtmlEngine"]
html-engine = { path = "../../../crates/html" }
