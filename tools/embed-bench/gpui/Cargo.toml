[package]
name = "embed-bench-gpui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
autobins = false

[workspace]

[features]
default = ["skrift"]
skrift = ["dep:html-dom", "dep:html-render-core", "dep:data-url", "dep:html", "dep:html-gpui", "dep:html-pipeline", "dep:html-resources", "dep:kurbo"]
wry-in-gpui = ["dep:gtk", "dep:cairo-rs", "dep:webkit2gtk", "dep:wry", "dep:url", "dep:percent-encoding", "dep:raw-window-handle"]

[[bin]]
name = "embed-bench-gpui-culled"
path = "src/workloads.rs"
required-features = ["skrift", "wry-in-gpui"]

[[bin]]
name = "embed-bench-gpui-skrift-size"
path = "src/skrift_size.rs"
required-features = ["skrift"]

[[bin]]
name = "embed-bench-gpui-wry-size"
path = "src/wry_size.rs"
required-features = ["wry-in-gpui"]

[dependencies]
html-dom = { version = "0.1.0", package = "skrift-dom", path = "../../../crates/html-dom", optional = true }
html-render-core = { version = "0.1.0", package = "skrift-render-core", path = "../../../crates/05-html-render-core", optional = true }
html-engine-model = { package = "skrift-engine-model", path = "../../../crates/html-engine-model" }
anyhow = "1"
async-channel = "2"
data-url = { version = "0.3", optional = true }
gpui = { path = "../../../../GPUI-Fork/crates/gpui", default-features = false, features = ["font-kit", "wayland", "x11", "snapshot", "windows-manifest"] }
gpui_platform = { path = "../../../../GPUI-Fork/crates/gpui_platform", features = ["wayland", "x11"] }
gpui_linux = { path = "../../../../GPUI-Fork/crates/gpui_linux", features = ["snapshot"] }
gpui_wgpu = { path = "../../../../GPUI-Fork/crates/gpui_wgpu", features = ["font-kit"] }
html = { version = "0.1.0", package = "skrift", path = "../../../crates/html", optional = true }
html-gpui = { path = "../../../adapters/html-gpui", optional = true }
html-pipeline = { version = "0.1.0", package = "skrift-pipeline", path = "../../../crates/html-pipeline", optional = true }
html-resources = { version = "0.1.0", package = "skrift-resources", path = "../../../crates/html-resources", optional = true }
kurbo = { version = "0.11", optional = true }
pollster = "0.4"
libc = "0.2"
serde_json = "1"
gtk = { version = "0.18", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }
webkit2gtk = { version = "2.0.1", features = ["v2_34"], optional = true }
wry = { package = "lb-wry", version = "=0.53.3", optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[patch."https://github.com/JohanAnderssonOstling/HtmlEngine"]
skrift = { path = "../../../crates/html" }
