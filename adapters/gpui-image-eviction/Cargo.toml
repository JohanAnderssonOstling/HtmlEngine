[package]
name = "gpui-image-eviction"
version = "0.1.0"
edition = "2024"
publish = false

[features]
kobo = []

[dependencies]
gpui.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "MediaQueryList"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false }
smallvec = "1"
