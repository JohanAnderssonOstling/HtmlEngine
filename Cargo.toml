[workspace]
exclude = ["adapters"]
resolver = "3"
members = [
    "crates/02-html-parse",
    "crates/03-html-style",
    "crates/04-html-layout",
    "crates/05-html-render-core",
    "crates/html",
    "crates/html-dom",
    "crates/html-pipeline",
    "crates/html-resources",
    "crates/html-style-model",
    "crates/html-text",
    "crates/html-engine-model",
    "crates/html-format",
    "crates/html-shape",
    "test-support/html-wpt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/JohanAnderssonOstling/HtmlEngine"
homepage = "https://github.com/JohanAnderssonOstling/HtmlEngine"
categories = ["rendering"]
keywords = ["html", "css", "skrift"]
include = ["src/**", "assets/**", "README.md", "LICENSE"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
kurbo = "0.11.3"
peniko = "0.2.0"
lightningcss = { version = "1.0.0-alpha.72", features = ["substitute_variables"] }
taffy = { version = "0.13.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
parcel_selectors = "0.28.2"
scraper = "0.27"
html5ever = "0.39"
quick-xml = { version = "0.41", features = ["escape-html"] }
encoding_rs = "0.8"
ego-tree = "0.11"
unicode-bidi = "0.3.18"
